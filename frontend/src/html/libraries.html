<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" type="text/css" href="/src/css/libraries.css" />
    <link rel="stylesheet" type="text/css" href="/src/css/settings.css" />
    <script src="/wails/ipc.js"></script>
    <script src="/wails/runtime.js"></script>
    <script src="/src/js/audio-manager.js" type="module"></script>
    <script src="/src/js/settings-apply.js" type="module"></script>
    <script src="/src/js/libraries.js" type="module"></script>
    <title>MusicLite · 我的音乐库</title>
</head>

<body class="lyric-anim-fade" data-page="libraries">
    <!-- 自定义标题栏（无边框窗口） -->
    <div class="titlebar">
        <div class="titlebar-left">
            <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" clip-rule="evenodd" xml:space="preserve"
                version="1.1">
                <g>
                    <g stroke-dasharray="5,2,2,2,2,2" fill="#666666" id="Icon">
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_1"
                            d="m11.7619,2.25c-5.381,0 -9.75,4.369 -9.75,9.75c0,5.381 4.369,9.75 9.75,9.75c5.381,0 9.75,-4.369 9.75,-9.75c0,-5.381 -4.369,-9.75 -9.75,-9.75zm0,1.5c4.553,0 8.25,3.697 8.25,8.25c0,4.553 -3.697,8.25 -8.25,8.25c-4.553,0 -8.25,-3.697 -8.25,-8.25c0,-4.553 3.697,-8.25 8.25,-8.25z" />
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_2"
                            d="m10.4729,8.841l-2.649,1.681c-0.506,0.321 -0.812,0.879 -0.812,1.478c0,0.599 0.306,1.157 0.812,1.478c0.799,0.506 1.817,1.152 2.649,1.681c0.539,0.342 1.222,0.363 1.781,0.056c0.559,-0.308 0.907,-0.896 0.907,-1.534c0,-1.035 0,-2.327 0,-3.362c0,-0.638 -0.348,-1.226 -0.907,-1.534c-0.559,-0.307 -1.242,-0.286 -1.781,0.056zm0.804,1.267c0.077,-0.049 0.175,-0.052 0.254,-0.008c0.08,0.044 0.13,0.128 0.13,0.219c0,1.035 0,2.327 0,3.362c0,0.091 -0.05,0.175 -0.13,0.219c-0.079,0.044 -0.177,0.041 -0.254,-0.008c-0.832,-0.528 -1.851,-1.174 -2.649,-1.681c-0.072,-0.046 -0.116,-0.125 -0.116,-0.211c0,-0.086 0.044,-0.165 0.116,-0.211l2.649,-1.681z" />
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_3"
                            d="m14.4109,8.75l0.006,0c0.964,0.003 1.744,0.786 1.744,1.75c0,0.871 0,2.129 0,3c0,0.964 -0.78,1.747 -1.744,1.75l-0.006,0l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0c0,0 0,0 0,0c0.138,0 0.25,-0.112 0.25,-0.25c0,-0.871 0,-2.129 0,-3c0,-0.138 -0.112,-0.25 -0.25,-0.25l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0z" />
                    </g>
                </g>
            </svg>
            <span class="titlebar-title">MusicLite Cuckoo</span>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="minimizeBtn" title="最小化" data-i18n-title="titlebar.minimize">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path d="M19 13H5v-2h14v2z" />
                </svg>
            </button>
            <button class="titlebar-btn titlebar-close" id="closeBtn" title="关闭" data-i18n-title="titlebar.close">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <h1 data-i18n="libraries.title">我的音乐库</h1>
        <div class="header-actions">
            <div class="search-box" id="searchBox">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
                    <path
                        d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" />
                </svg>
                <input type="text" id="searchInput" class="search-input" placeholder="搜索曲目或艺术家"
                    data-i18n-placeholder="libraries.searchPlaceholder" />
                <button class="search-clear" id="searchClear" title="清除" data-i18n-title="libraries.clearSearch"
                    style="display:none;">
                    <svg viewBox="0 0 24 24" width="14" height="14">
                        <path
                            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                    </svg>
                </button>
            </div>
            <button class="btn-open" id="openFileBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                <span data-i18n="libraries.importFiles">导入文件</span>
            </button>
            <button class="btn-stats" id="statsBtn" title="听歌统计" data-i18n-title="libraries.stats">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 20V10M12 20V4M6 20v-6" />
                </svg>
            </button>
            <button class="btn-designer" id="designerBtn" title="设计器" data-i18n-title="common.designer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" y1="21" x2="4" y2="14"></line>
                    <line x1="4" y1="10" x2="4" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12" y2="3"></line>
                    <line x1="20" y1="21" x2="20" y2="16"></line>
                    <line x1="20" y1="12" x2="20" y2="3"></line>
                    <line x1="1" y1="14" x2="7" y2="14"></line>
                    <line x1="9" y1="8" x2="15" y2="8"></line>
                    <line x1="17" y1="16" x2="23" y2="16"></line>
                </svg>
            </button>
            <button class="btn-queue-toggle" id="libQueueBtn" title="播放队列" data-i18n-title="player.queue">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="8" y1="6" x2="21" y2="6"></line>
                    <line x1="8" y1="12" x2="21" y2="12"></line>
                    <line x1="8" y1="18" x2="21" y2="18"></line>
                    <line x1="3" y1="6" x2="3.01" y2="6"></line>
                    <line x1="3" y1="12" x2="3.01" y2="12"></line>
                    <line x1="3" y1="18" x2="3.01" y2="18"></line>
                </svg>
                <span class="queue-badge lib-queue-badge" id="libQueueBadge" style="display:none;">0</span>
            </button>
            <button class="btn-settings" id="settingsBtn" title="设置" data-i18n-title="common.settings">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="tracks-header">
            <div class="tracks-title-group">
                <h2 data-i18n="libraries.allTracks">全部曲目</h2>
                <button class="btn-play-all" id="playAllBtn" title="播放全部" data-i18n-title="libraries.playAll">
                    <svg viewBox="0 0 24 24" width="14" height="14">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                    <span data-i18n="libraries.playAll">播放全部</span>
                </button>
            </div>
            <div class="tracks-controls">
                <div class="sort-control" id="sortControl" role="group" aria-label="排序方式">
                    <button class="sort-btn" data-sort="recent" title="最近添加" data-i18n-title="libraries.sortRecent"
                        data-i18n="libraries.sortRecent">最近添加</button>
                    <button class="sort-btn" data-sort="title" title="标题" data-i18n-title="libraries.sortTitle"
                        data-i18n="libraries.sortTitle">标题</button>
                    <button class="sort-btn" data-sort="artist" title="艺术家" data-i18n-title="libraries.sortArtist"
                        data-i18n="libraries.sortArtist">艺术家</button>
                </div>
                <div class="view-toggle" id="view-toggle" role="switch" tabindex="0" aria-label="切换卡片/列表模式"
                    data-i18n-title="settings.listMode">
                    <span class="view-toggle-thumb">
                        <svg class="view-toggle-icon view-toggle-icon-card" viewBox="0 0 24 24" width="14" height="14">
                            <path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z" />
                        </svg>
                        <svg class="view-toggle-icon view-toggle-icon-list" viewBox="0 0 24 24" width="14" height="14">
                            <path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z" />
                        </svg>
                    </span>
                </div>
            </div>
        </div>
        <div id="media-container" class="media-grid"></div>

        <div id="empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
            </svg>
            <h2 data-i18n="libraries.empty">音乐库是空的</h2>
            <p data-i18n="libraries.emptyHint">点击"导入文件"按钮添加音乐</p>
        </div>
        <div id="no-results" class="empty-state no-results" style="display:none;">
            <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                <line x1="8" y1="11" x2="14" y2="11" />
            </svg>
            <h2 data-i18n="libraries.noResults">没有匹配的曲目</h2>
            <p data-i18n="libraries.noResultsHint">试试其他关键词</p>
        </div>

    </main>

    <!-- 主页播放队列侧栏（浮层：脱离文档流，不挤压主内容） -->
    <div class="lib-queue-overlay" id="libQueueOverlay"></div>
    <aside class="lib-queue-sidebar" id="libQueueSidebar">
        <div class="lib-queue-header">
            <h3 data-i18n="player.queue">播放队列</h3>
            <div class="lib-queue-actions">
                <button class="queue-action-btn" id="libQueueShuffleBtn" title="洗牌"
                    data-i18n-title="player.queueShuffle">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="16 3 21 3 21 8"></polyline>
                        <line x1="4" y1="20" x2="21" y2="3"></line>
                        <polyline points="21 16 21 21 16 21"></polyline>
                        <line x1="15" y1="15" x2="21" y2="21"></line>
                        <line x1="4" y1="4" x2="9" y2="9"></line>
                    </svg>
                </button>
                <button class="queue-action-btn" id="libQueueClearBtn" title="清空" data-i18n-title="player.queueClear">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
                <button class="queue-action-btn" id="libQueueCloseBtn" title="关闭" data-i18n-title="common.close">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
        </div>
        <div class="lib-queue-dropzone" id="libQueueList">
            <div class="queue-empty" data-i18n="player.queueEmpty">队列为空，右键曲目加入队列</div>
        </div>
    </aside>

    <!-- Mini Player Bar -->
    <div id="mini-player" class="mini-player" style="display: none;">
        <div class="mini-player-left">
            <div id="mini-cover" class="mini-cover"></div>
            <div class="mini-info">
                <div id="mini-title" class="mini-title" data-i18n="libraries.notPlaying">未播放</div>
                <div id="mini-artist" class="mini-artist">--</div>
            </div>
        </div>
        <div class="mini-player-center">
            <button class="mini-btn" id="mini-prev" title="上一曲" data-i18n-title="player.prevTrack">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                </svg>
            </button>
            <button class="mini-btn mini-play-btn" id="mini-play" title="播放" data-i18n-title="common.play">
                <svg viewBox="0 0 24 24" width="24" height="24" id="mini-play-icon">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg viewBox="0 0 24 24" width="24" height="24" id="mini-pause-icon" style="display:none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>
            <button class="mini-btn" id="mini-next" title="下一曲" data-i18n-title="player.nextTrack">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                </svg>
            </button>
        </div>
        <div class="mini-player-right">
            <button class="mini-btn" id="mini-expand" title="打开播放器" data-i18n-title="libraries.openPlayer">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 3 21 3 21 9"></polyline>
                    <polyline points="9 21 3 21 3 15"></polyline>
                    <line x1="21" y1="3" x2="14" y2="10"></line>
                    <line x1="3" y1="21" x2="10" y2="14"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Edit Track Modal -->
    <div id="modal-edit" class="modal-backdrop">
        <div class="modal modal-large">
            <h3 data-i18n="libraries.editTrackTitle">编辑曲目信息</h3>
            <div class="edit-modal-body">
                <!-- 封面预览 + 更换 -->
                <div class="edit-cover-section">
                    <div class="edit-cover-preview" id="edit-cover-preview">
                        <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                    </div>
                    <div class="edit-cover-actions">
                        <button class="btn btn-secondary btn-sm" id="edit-cover-pick"
                            data-i18n="libraries.changeCover">更换封面</button>
                        <button class="btn btn-secondary btn-sm" id="edit-cover-clear"
                            data-i18n="libraries.clearCover">清除</button>
                    </div>
                </div>
                <!-- 右侧：标题/艺术家/歌词 -->
                <div class="edit-fields-section">
                    <div class="form-group">
                        <label data-i18n="libraries.titleLabel">标题</label>
                        <input type="text" id="edit-title" class="form-input" placeholder="曲目标题" />
                    </div>
                    <div class="form-group">
                        <label data-i18n="libraries.artistLabel">艺术家</label>
                        <input type="text" id="edit-artist" class="form-input" placeholder="艺术家" />
                    </div>
                    <div class="form-group">
                        <label data-i18n="libraries.lyricsFormat">歌词 (LRC 格式)</label>
                        <textarea id="edit-lyrics" class="form-textarea"
                            placeholder="粘贴 LRC 歌词，如：&#10;[00:12.34]歌词内容&#10;[00:15.67]下一行"
                            data-i18n-placeholder="libraries.lyricsPlaceholder"></textarea>
                        <div class="edit-lyrics-actions">
                            <button class="btn btn-secondary btn-sm" id="edit-lyrics-pick"
                                data-i18n="libraries.importFromFile">从文件导入</button>
                            <button class="btn btn-secondary btn-sm" id="edit-lyrics-clear"
                                data-i18n="libraries.clearLyrics">清空</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="edit-drop-hint" data-i18n="libraries.dropEditHint">拖放封面图片或歌词文件到此处</div>
            <div class="modal-buttons">
                <button class="btn btn-secondary modal-cancel" data-action="cancel"
                    data-i18n="common.cancel">取消</button>
                <button class="btn btn-primary modal-save" data-action="save" data-i18n="common.save">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div id="modal-confirm" class="modal-backdrop">
        <div class="modal modal-confirm">
            <div class="confirm-icon" id="confirm-icon">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </div>
            <h3 id="confirm-title" data-i18n="libraries.confirmDeleteTitle">确认删除</h3>
            <p id="confirm-message" data-i18n="libraries.confirmDeleteMsg">确定要删除吗？</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="confirm-cancel" data-i18n="common.cancel">取消</button>
                <button class="btn btn-danger" id="confirm-ok" data-i18n="common.delete">删除</button>
            </div>
        </div>
    </div>

    <!-- 拖放导入遮罩 -->
    <div id="drop-overlay" class="drop-overlay">
        <div class="drop-overlay-inner">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div class="drop-overlay-text" data-i18n="libraries.dropText">松开鼠标导入音乐文件</div>
            <div class="drop-overlay-hint" data-i18n="libraries.dropHint">支持 MP3 / OGG / FLAC / WAV / APE</div>
        </div>
    </div>

    <!-- Toast 通知容器 -->
    <div id="toast-container" class="toast-container"></div>

    <div id="player-overlay" class="player-overlay">
        <div class="player-bg-layer" id="bgLayer"></div>
        <div class="player-container">
            <div class="album-art-wrapper">
                <div class="album-art" id="coverImg"></div>
            </div>
            <div class="info-and-controls">
                <div class="track-info">
                    <div class="track-name" id="trackName" data-i18n="common.loading">加载中</div>
                    <div class="artist-name" id="artistName">--</div>
                </div>
                <div class="lyrics-area" id="lyricsArea">
                    <div class="lyrics-collapsed" id="lyricsToggle">
                        <div class="lyrics-preview" id="lyricsPreview" data-i18n="player.noLyrics">暂无歌词</div>
                    </div>
                    <div class="lyrics-card" id="lyricsCard">
                        <div class="lyrics-nav-group">

                            <button class="lyrics-mode-btn" id="expandFullscreenBtn" title="全屏歌词"
                                data-i18n-title="player.fullscreenLyrics">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="15 3 21 3 21 9"></polyline>
                                    <polyline points="9 21 3 21 3 15"></polyline>
                                    <line x1="21" y1="3" x2="14" y2="10"></line>
                                    <line x1="3" y1="21" x2="10" y2="14"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="lyrics-wrapper" id="lyricsWrapper">
                            <div class="lyrics-content" id="lyricsContent">
                                <div class="no-lyrics" data-i18n="player.noLyrics">暂无歌词</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="progress-area">
                    <span class="time-current" id="currentTime">0:00</span>
                    <div class="slider-container">
                        <div class="track-bg"></div>
                        <div class="progress-fill" id="seekProgress"></div>
                        <input type="range" min="0" max="100" value="0" class="seek_slider" id="seekSlider" disabled>
                    </div>
                    <span class="time-duration" id="totalDuration">0:00</span>
                </div>
                <div class="controls-area">
                    <div class="main-controls">
                        <button class="btn btn-play" id="playBtn">
                            <svg viewBox="0 0 24 24" id="playIcon">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                            <svg viewBox="0 0 24 24" id="pauseIcon">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                            </svg>
                        </button>
                        <button class="btn btn-next" id="prevBtn" title="上一曲" data-i18n-title="player.prevTrack">
                            <svg viewBox="0 0 24 24">
                                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
                            </svg>
                        </button>
                        <button class="btn btn-next" id="nextBtn" title="下一曲" data-i18n-title="player.nextTrack">
                            <svg viewBox="0 0 24 24">
                                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                            </svg>
                        </button>
                        <button class="btn btn-loop" id="loopBtn" title="单曲循环" data-i18n-title="player.loopOne">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                            </svg>
                        </button>
                        <button class="btn btn-eq" id="eqBtn" title="均衡器" data-i18n-title="player.equalizer">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="4" y1="21" x2="4" y2="14"></line>
                                <line x1="4" y1="10" x2="4" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="12"></line>
                                <line x1="12" y1="8" x2="12" y2="3"></line>
                                <line x1="20" y1="21" x2="20" y2="16"></line>
                                <line x1="20" y1="12" x2="20" y2="3"></line>
                                <line x1="1" y1="14" x2="7" y2="14"></line>
                                <line x1="9" y1="8" x2="15" y2="8"></line>
                                <line x1="17" y1="16" x2="23" y2="16"></line>
                            </svg>
                        </button>
                        <button class="btn btn-queue" id="queueBtn" title="播放队列" data-i18n-title="player.queue">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="8" y1="6" x2="21" y2="6"></line>
                                <line x1="8" y1="12" x2="21" y2="12"></line>
                                <line x1="8" y1="18" x2="21" y2="18"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18"></line>
                            </svg>
                            <span class="queue-badge" id="queueBadge" style="display:none;">0</span>
                        </button>
                    </div>
                    <div class="volume-control">
                        <div class="volume-icon" id="volIcon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                            </svg>
                        </div>
                        <div class="slider-container volume-slider-container">
                            <div class="track-bg"></div>
                            <div class="progress-fill" id="volProgress"></div>
                            <input type="range" min="0" max="100" value="70" class="volume_slider" id="volSlider">
                        </div>
                    </div>
                    <button class="btn btn-back" id="backBtn" title="返回音乐库" data-i18n-title="player.backToLibrary">
                        <svg viewBox="0 0 24 24" fill="currentColor">
  <path d="M17.41 5.41L16 4l-8 8 8 8 1.41-1.41L10.83 12z"/>
</svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 全屏歌词视图 -->
        <div class="fullscreen-lyrics" id="fullscreenLyrics">
            <div class="fullscreen-lyrics-bg" id="fullscreenBg"></div>
            <div class="lyrics-nav-group fullscreen-nav-group">
                <button class="lyrics-mode-btn fullscreen-mode-btn" id="collapseCardBtn" title="返回卡片歌词"
                    data-i18n-title="player.backToCardLyrics">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="4 14 10 14 10 20"></polyline>
                        <polyline points="20 10 14 10 14 4"></polyline>
                        <line x1="14" y1="10" x2="21" y2="3"></line>
                        <line x1="3" y1="21" x2="10" y2="14"></line>
                    </svg>
                </button>
            </div>
            <div class="fullscreen-lyrics-header">
                <div class="fullscreen-track-name" id="fullscreenTrackName"></div>
                <div class="fullscreen-artist-name" id="fullscreenArtistName"></div>
            </div>
            <div class="fullscreen-lyrics-wrapper" id="fullscreenLyricsWrapper">
                <div class="fullscreen-lyrics-content" id="fullscreenLyricsContent">
                    <div class="no-lyrics" data-i18n="player.noLyrics">暂无歌词</div>
                </div>
            </div>
        </div>

        <!-- 均衡器面板 -->
        <div class="eq-panel" id="eqPanel">
            <div class="eq-panel-header">
                <h3 data-i18n="player.equalizer">均衡器</h3>
                <div class="eq-panel-actions">
                    <label class="eq-switch" title="启用/旁路" data-i18n-title="player.eqToggle">
                        <input type="checkbox" id="eqEnabledToggle" />
                        <span class="eq-switch-track"><span class="eq-switch-thumb"></span></span>
                    </label>
                    <button class="eq-reset-btn" id="eqResetBtn" title="重置" data-i18n-title="common.reset">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                            <path d="M3 3v5h5"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="eq-bands" id="eqBands"><!-- JS 动态生成 10 个频段滑块 --></div>
            <div class="eq-hint" data-i18n="player.eqHint">拖动滑块调节各频段增益（±12 dB），点击空白处或按 ESC 关闭</div>
        </div>

        <!-- 播放队列面板 -->
        <div class="queue-panel" id="queuePanel">
            <div class="queue-panel-header">
                <h3 data-i18n="player.queue">播放队列</h3>
                <div class="queue-panel-actions">
                    <button class="queue-action-btn" id="queueShuffleBtn" title="洗牌"
                        data-i18n-title="player.queueShuffle">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="16 3 21 3 21 8"></polyline>
                            <line x1="4" y1="20" x2="21" y2="3"></line>
                            <polyline points="21 16 21 21 16 21"></polyline>
                            <line x1="15" y1="15" x2="21" y2="21"></line>
                            <line x1="4" y1="4" x2="9" y2="9"></line>
                        </svg>
                    </button>
                    <button class="queue-action-btn" id="queueClearBtn" title="清空" data-i18n-title="player.queueClear">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="queue-list" id="queueList">
                <div class="queue-empty" data-i18n="player.queueEmpty">队列为空，右键曲目加入队列</div>
            </div>
        </div>
    </div>

    <!-- 确认对话框（复用于听歌统计弹窗） -->
    <div class="modal-backdrop" id="confirmModal">
        <div class="modal modal-confirm">
            <div class="confirm-icon">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </div>
            <h3 id="confirmTitle">确认操作</h3>
            <p id="confirmMessage">确定要执行此操作吗？</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="confirmCancel">取消</button>
                <button class="btn btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>
</body>

</html>
