<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/src/css/libraries.css" />
    <script src="/wails/ipc.js"></script>
    <script src="/wails/runtime.js"></script>
    <script src="/src/js/audio-manager.js" type="module"></script>
    <script src="/src/js/settings-apply.js" type="module"></script>
    <script src="/src/js/libraries.js" type="module"></script>
    <title>MusicLite · 我的音乐库</title>
</head>

<body>
    <!-- 自定义标题栏（无边框窗口） -->
    <div class="titlebar">
        <div class="titlebar-left">
            <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" clip-rule="evenodd" xml:space="preserve"
                version="1.1">

                <g>
                    <rect opacity="0" stroke-width="0" rx="4" id="svg_5" height="23.09522" width="23.09522" y="0.45239"
                        x="0.45239" stroke="#000" fill="#ececf1" />
                    <g stroke-dasharray="5,2,2,2,2,2" fill="#666666" id="Icon">
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_1"
                            d="m11.7619,2.25c-5.381,0 -9.75,4.369 -9.75,9.75c0,5.381 4.369,9.75 9.75,9.75c5.381,0 9.75,-4.369 9.75,-9.75c0,-5.381 -4.369,-9.75 -9.75,-9.75zm0,1.5c4.553,0 8.25,3.697 8.25,8.25c0,4.553 -3.697,8.25 -8.25,8.25c-4.553,0 -8.25,-3.697 -8.25,-8.25c0,-4.553 3.697,-8.25 8.25,-8.25z" />
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_2"
                            d="m10.4729,8.841l-2.649,1.681c-0.506,0.321 -0.812,0.879 -0.812,1.478c0,0.599 0.306,1.157 0.812,1.478c0.799,0.506 1.817,1.152 2.649,1.681c0.539,0.342 1.222,0.363 1.781,0.056c0.559,-0.308 0.907,-0.896 0.907,-1.534c0,-1.035 0,-2.327 0,-3.362c0,-0.638 -0.348,-1.226 -0.907,-1.534c-0.559,-0.307 -1.242,-0.286 -1.781,0.056zm0.804,1.267c0.077,-0.049 0.175,-0.052 0.254,-0.008c0.08,0.044 0.13,0.128 0.13,0.219c0,1.035 0,2.327 0,3.362c0,0.091 -0.05,0.175 -0.13,0.219c-0.079,0.044 -0.177,0.041 -0.254,-0.008c-0.832,-0.528 -1.851,-1.174 -2.649,-1.681c-0.072,-0.046 -0.116,-0.125 -0.116,-0.211c0,-0.086 0.044,-0.165 0.116,-0.211l2.649,-1.681z" />
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_3"
                            d="m14.4109,8.75l0.006,0c0.964,0.003 1.744,0.786 1.744,1.75c0,0.871 0,2.129 0,3c0,0.964 -0.78,1.747 -1.744,1.75l-0.006,0l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0c0,0 0,0 0,0c0.138,0 0.25,-0.112 0.25,-0.25c0,-0.871 0,-2.129 0,-3c0,-0.138 -0.112,-0.25 -0.25,-0.25l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0z" />
                    </g>
                </g>
            </svg>
            <span class="titlebar-title">MusicLite</span>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="minimizeBtn" title="最小化">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path d="M6 19h12v2H6z" />
                </svg>
            </button>
            <button class="titlebar-btn titlebar-close" id="closeBtn" title="关闭">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Header -->
    <header>
        <h1>我的音乐库</h1>
        <div class="header-actions">
            <button class="btn-open" id="openFileBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                导入文件
            </button>
            <button class="btn-settings" id="settingsBtn" title="设置">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <h2>全部曲目</h2>
        <div id="media-container" class="media-grid"></div>

        <div id="empty-state" class="empty-state">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 18V5l12-2v13" />
                <circle cx="6" cy="18" r="3" />
                <circle cx="18" cy="16" r="3" />
            </svg>
            <h2>音乐库是空的</h2>
            <p>点击"导入文件"按钮添加音乐</p>
        </div>
    </main>

    <!-- Mini Player Bar -->
    <div id="mini-player" class="mini-player" style="display: none;">
        <div class="mini-player-left">
            <div id="mini-cover" class="mini-cover"></div>
            <div class="mini-info">
                <div id="mini-title" class="mini-title">未播放</div>
                <div id="mini-artist" class="mini-artist">--</div>
            </div>
        </div>
        <div class="mini-player-center">
            <button class="mini-btn mini-play-btn" id="mini-play" title="播放">
                <svg viewBox="0 0 24 24" width="24" height="24" id="mini-play-icon">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg viewBox="0 0 24 24" width="24" height="24" id="mini-pause-icon" style="display:none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>
        </div>
        <div class="mini-player-right">
            <button class="mini-btn" id="mini-expand" title="打开播放器">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Edit Track Modal -->
    <div id="modal-edit" class="modal-backdrop">
        <div class="modal modal-large">
            <h3>编辑曲目信息</h3>
            <div class="form-group">
                <label>标题</label>
                <input type="text" id="edit-title" class="form-input" placeholder="曲目标题" />
            </div>
            <div class="form-group">
                <label>艺术家</label>
                <input type="text" id="edit-artist" class="form-input" placeholder="艺术家" />
            </div>
            <div class="form-group">
                <label>歌词 (LRC 格式)</label>
                <textarea id="edit-lyrics" class="form-textarea"
                    placeholder="粘贴 LRC 歌词，如：&#10;[00:12.34]歌词内容&#10;[00:15.67]下一行"></textarea>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary modal-cancel" data-action="cancel">取消</button>
                <button class="btn btn-primary modal-save" data-action="save">保存</button>
            </div>
        </div>
    </div>

    <!-- Lyrics Edit Modal -->
    <div id="modal-lyrics-edit" class="modal-backdrop">
        <div class="modal modal-large">
            <h3>编辑歌词</h3>
            <div class="form-group">
                <label>歌词内容 (LRC 格式)</label>
                <textarea id="lyrics-textarea" class="form-textarea" placeholder="粘贴或输入 LRC 格式歌词"></textarea>
            </div>
            <div class="form-group">
                <label>从文件导入</label>
                <input type="file" id="lyrics-file-input" accept=".lrc,.txt" class="form-file" />
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary modal-cancel" data-action="cancel">取消</button>
                <button class="btn btn-primary modal-save" data-action="save">保存</button>
            </div>
        </div>
    </div>

    <!-- 确认对话框 -->
    <div id="modal-confirm" class="modal-backdrop">
        <div class="modal modal-confirm">
            <div class="confirm-icon" id="confirm-icon">
                <svg viewBox="0 0 24 24" width="32" height="32">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                </svg>
            </div>
            <h3 id="confirm-title">确认删除</h3>
            <p id="confirm-message">确定要删除吗？</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="confirm-cancel">取消</button>
                <button class="btn btn-danger" id="confirm-ok">删除</button>
            </div>
        </div>
    </div>

    <!-- Toast 通知容器 -->
    <div id="toast-container" class="toast-container"></div>

    <div id="player-overlay" class="player-overlay">
        <div class="player-bg-layer" id="bgLayer"></div>
        <div class="player-container">
            <div class="album-art-wrapper">
                <div class="album-art" id="coverImg"></div>
            </div>
            <div class="info-and-controls">
                <div class="track-info">
                    <div class="track-name" id="trackName">加载中</div>
                    <div class="artist-name" id="artistName">--</div>
                </div>
                <div class="lyrics-area" id="lyricsArea">
                    <div class="lyrics-collapsed" id="lyricsToggle">
                        <div class="lyrics-preview" id="lyricsPreview">暂无歌词</div>
                    </div>
                    <div class="lyrics-card" id="lyricsCard">
                        <button class="lyrics-mode-btn" id="expandFullscreenBtn" title="全屏歌词">
                            <svg viewBox="0 0 24 24" width="14" height="14">
                                <path
                                    d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z" />
                            </svg>
                        </button>
                        <div class="lyrics-wrapper" id="lyricsWrapper">
                            <div class="lyrics-content" id="lyricsContent">
                                <div class="no-lyrics">暂无歌词</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="progress-area">
                    <span class="time-current" id="currentTime">0:00</span>
                    <div class="slider-container">
                        <div class="track-bg"></div>
                        <div class="progress-fill" id="seekProgress"></div>
                        <input type="range" min="0" max="100" value="0" class="seek_slider" id="seekSlider" disabled>
                    </div>
                    <span class="time-duration" id="totalDuration">0:00</span>
                </div>
                <div class="controls-area">
                    <div class="main-controls">
                        <button class="btn btn-play" id="playBtn">
                            <svg viewBox="0 0 24 24" id="playIcon">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                            <svg viewBox="0 0 24 24" id="pauseIcon">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                            </svg>
                        </button>
                        <button class="btn btn-next" id="nextBtn" title="下一曲">
                            <svg viewBox="0 0 24 24">
                                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                            </svg>
                        </button>
                        <button class="btn btn-loop" id="loopBtn" title="单曲循环">
                            <svg viewBox="0 0 24 24">
                                <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
                            </svg>
                        </button>
                    </div>
                    <div class="volume-control">
                        <div class="volume-icon" id="volIcon">
                            <svg viewBox="0 0 24 24">
                                <path
                                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                            </svg>
                        </div>
                        <div class="slider-container volume-slider-container">
                            <div class="track-bg"></div>
                            <div class="progress-fill" id="volProgress"></div>
                            <input type="range" min="0" max="100" value="70" class="volume_slider" id="volSlider">
                        </div>
                    </div>
                    <button class="btn btn-back" id="backBtn" title="返回音乐库">
                        <svg viewBox="0 0 24 24">
                            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 全屏歌词视图 -->
        <div class="fullscreen-lyrics" id="fullscreenLyrics">
            <div class="fullscreen-lyrics-bg" id="fullscreenBg"></div>
            <button class="lyrics-mode-btn fullscreen-mode-btn" id="collapseCardBtn" title="返回卡片歌词">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z" />
                </svg>
            </button>
            <div class="fullscreen-lyrics-header">
                <div class="fullscreen-track-name" id="fullscreenTrackName"></div>
                <div class="fullscreen-artist-name" id="fullscreenArtistName"></div>
            </div>
            <div class="fullscreen-lyrics-wrapper" id="fullscreenLyricsWrapper">
                <div class="fullscreen-lyrics-content" id="fullscreenLyricsContent">
                    <div class="no-lyrics">暂无歌词</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
