<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" type="text/css" href="/src/css/libraries.css" />
    <link rel="stylesheet" type="text/css" href="/src/css/settings.css" />
    <link rel="stylesheet" type="text/css" href="/src/css/designer.css" />
    <script src="/wails/ipc.js"></script>
    <script src="/wails/runtime.js"></script>
    <script src="/src/js/audio-manager.js" type="module"></script>
    <script src="/src/js/settings-apply.js" type="module"></script>
    <script src="/src/js/designer.js" type="module"></script>
    <title>设计器 · MusicLite</title>
</head>

<body data-page="designer">

    <div class="titlebar">
        <div class="titlebar-left">
            <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" clip-rule="evenodd" xml:space="preserve"
                version="1.1">
                <g>
                    <g stroke-dasharray="5,2,2,2,2,2" fill="#666666" id="Icon">
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_1"
                            d="m11.7619,2.25c-5.381,0 -9.75,4.369 -9.75,9.75c0,5.381 4.369,9.75 9.75,9.75c5.381,0 9.75,-4.369 9.75,-9.75c0,-5.381 -4.369,-9.75 -9.75,-9.75zm0,1.5c4.553,0 8.25,3.697 8.25,8.25c0,4.553 -3.697,8.25 -8.25,8.25c-4.553,0 -8.25,-3.697 -8.25,-8.25c0,-4.553 3.697,-8.25 8.25,-8.25z" />
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_2"
                            d="m10.4729,8.841l-2.649,1.681c-0.506,0.321 -0.812,0.879 -0.812,1.478c0,0.599 0.306,1.157 0.812,1.478c0.799,0.506 1.817,1.152 2.649,1.681c0.539,0.342 1.222,0.363 1.781,0.056c0.559,-0.308 0.907,-0.896 0.907,-1.534c0,-1.035 0,-2.327 0,-3.362c0,-0.638 -0.348,-1.226 -0.907,-1.534c-0.559,-0.307 -1.242,-0.286 -1.781,0.056zm0.804,1.267c0.077,-0.049 0.175,-0.052 0.254,-0.008c0.08,0.044 0.13,0.128 0.13,0.219c0,1.035 0,2.327 0,3.362c0,0.091 -0.05,0.175 -0.13,0.219c-0.079,0.044 -0.177,0.041 -0.254,-0.008c-0.832,-0.528 -1.851,-1.174 -2.649,-1.681c-0.072,-0.046 -0.116,-0.125 -0.116,-0.211c0,-0.086 0.044,-0.165 0.116,-0.211l2.649,-1.681z" />
                        <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_3"
                            d="m14.4109,8.75l0.006,0c0.964,0.003 1.744,0.786 1.744,1.75c0,0.871 0,2.129 0,3c0,0.964 -0.78,1.747 -1.744,1.75l-0.006,0l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0c0,0 0,0 0,0c0.138,0 0.25,-0.112 0.25,-0.25c0,-0.871 0,-2.129 0,-3c0,-0.138 -0.112,-0.25 -0.25,-0.25l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0z" />
                    </g>
                </g>
            </svg>
            <span class="titlebar-title">MusicLite Cuckoo</span>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="minimizeBtn" title="最小化" data-i18n-title="titlebar.minimize">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path d="M6 19h12v2H6z" />
                </svg>
            </button>
            <button class="titlebar-btn titlebar-close" id="closeBtn" title="关闭" data-i18n-title="titlebar.close">
                <svg viewBox="0 0 24 24" width="14" height="14">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
    </div>

    <header>
        <button class="btn-back" id="backBtn" title="返回" data-i18n-title="common.back">
            <svg viewBox="0 0 24 24" width="24" height="24">
                <path d="M17.41 5.41L16 4l-8 8 8 8 1.41-1.41L10.83 12z" />
            </svg>
        </button>
        <h1 data-i18n="designer.title">设计器</h1>
    </header>

    <main class="designer-main">
        <!-- 左侧：控件区 -->
        <div class="designer-controls">
            <!-- 主题与配色 -->
            <section class="settings-section" data-section-id="appearance">
                <h2 data-i18n="designer.appearance">外观</h2>

                <div class="setting-item">
                    <label data-i18n="designer.themeMode">主题模式</label>
                    <div class="theme-selector">
                        <button class="theme-btn active" data-theme="dark">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path
                                    d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z" />
                            </svg>
                            <span data-i18n="designer.themeDark">深色</span>
                        </button>
                        <button class="theme-btn" data-theme="light">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path
                                    d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 0 0-1.41 0 .996.996 0 0 0 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 0 0 0-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 0 0 0-1.41.996.996 0 0 0-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
                            </svg>
                            <span data-i18n="designer.themeLight">浅色</span>
                        </button>
                        <button class="theme-btn" data-theme="accent">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path
                                    d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z" />
                            </svg>
                            <span data-i18n="designer.themeAccent">墨绿</span>
                        </button>
                        <button class="theme-btn" data-theme="custom">
                            <svg viewBox="0 0 24 24" width="20" height="20">
                                <path
                                    d="M12 2C6.49 2 2 6.49 2 12s4.49 10 10 10c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c3.31 0 6-2.69 6-6 0-4.96-4.49-9-10-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 8 6.5 8 8 8.67 8 9.5 7.33 11 6.5 11zm3-4C8.67 7 8 6.33 8 5.5S8.67 4 9.5 4s1.5.67 1.5 1.5S10.33 7 9.5 7zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 4 14.5 4s1.5.67 1.5 1.5S15.33 7 14.5 7zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 8 17.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
                            </svg>
                            <span data-i18n="designer.themeCustom">主题色</span>
                        </button>
                    </div>
                </div>

                <div class="setting-item" id="accent-color-item" style="display: none;">
                    <label for="accent-color" data-i18n="designer.customAccent">自定义主题色</label>
                    <div class="color-picker-row">
                        <input type="color" id="accent-color" class="color-picker" value="#1DB954" />
                        <input type="text" id="accent-color-text" class="color-text" value="#1DB954" maxlength="7" />
                    </div>
                </div>
            </section>

            <!-- 形状与圆角 -->
            <section class="settings-section" data-section-id="shape">
                <h2 data-i18n="designer.shape">形状与圆角</h2>
                <div class="setting-item">
                    <label for="radius-slider" data-i18n="designer.radius">界面圆角</label>
                    <div class="slider-row">
                        <input type="range" id="radius-slider" min="0" max="28" value="10" step="0.5"
                            class="setting-slider" />
                        <span id="radius-value" class="slider-value">10px</span>
                    </div>
                    <span class="toggle-desc" data-i18n="designer.radiusDesc">卡片、按钮、面板的圆角大小</span>
                </div>
            </section>

            <!-- 光影与模糊 -->
            <section class="settings-section" data-section-id="light">
                <h2 data-i18n="designer.light">光影与模糊</h2>

                <div class="setting-item">
                    <label for="blur-slider" data-i18n="designer.blur">毛玻璃模糊</label>
                    <div class="slider-row">
                        <input type="range" id="blur-slider" min="0" max="40" value="16" step="1"
                            class="setting-slider" />
                        <span id="blur-value" class="slider-value">16px</span>
                    </div>
                    <span class="toggle-desc" data-i18n="designer.blurDesc">浮层背景的毛玻璃模糊量</span>
                </div>

                <div class="setting-item">
                    <label for="shadow-slider" data-i18n="designer.shadow">浮层阴影</label>
                    <div class="slider-row">
                        <input type="range" id="shadow-slider" min="0" max="1" value="0.45" step="0.05"
                            class="setting-slider" />
                        <span id="shadow-value" class="slider-value">45%</span>
                    </div>
                    <span class="toggle-desc" data-i18n="designer.shadowDesc">弹窗与浮层的阴影强度</span>
                </div>

                <div class="setting-item">
                    <label for="glow-slider" data-i18n="designer.glow">主题色辉光</label>
                    <div class="slider-row">
                        <input type="range" id="glow-slider" min="0" max="1" value="0.35" step="0.05"
                            class="setting-slider" />
                        <span id="glow-value" class="slider-value">35%</span>
                    </div>
                    <span class="toggle-desc" data-i18n="designer.glowDesc">强调色周围的辉光范围</span>
                </div>

                <div class="setting-item">
                    <label for="text-glow-slider" data-i18n="designer.textGlow">字体晕影</label>
                    <div class="slider-row">
                        <input type="range" id="text-glow-slider" min="0" max="1" value="0" step="0.05"
                            class="setting-slider" />
                        <span id="text-glow-value" class="slider-value">0%</span>
                    </div>
                    <span class="toggle-desc" data-i18n="designer.textGlowDesc">标题文字的主题色晕影</span>
                </div>
            </section>

            <!-- 动画 -->
            <section class="settings-section" data-section-id="animation">
                <h2 data-i18n="designer.animation">动画</h2>

                <div class="setting-item">
                    <label for="anim-speed-slider" data-i18n="designer.animSpeed">动画速度</label>
                    <div class="slider-row">
                        <input type="range" id="anim-speed-slider" min="0.3" max="2.5" value="1" step="0.1"
                            class="setting-slider" />
                        <span id="anim-speed-value" class="slider-value">1.0×</span>
                    </div>
                    <span class="toggle-desc" data-i18n="designer.animSpeedDesc">全局动画速度倍率（影响过渡与入场动画）</span>
                </div>

                <div class="setting-item">
                    <label data-i18n="designer.animLevel">界面动画级别</label>
                    <div class="anim-level-row">
                        <button type="button" class="anim-level-btn" data-level="0"
                            data-i18n="designer.animNone">无动画</button>
                        <button type="button" class="anim-level-btn" data-level="1"
                            data-i18n="designer.animBasic">基础</button>
                        <button type="button" class="anim-level-btn active" data-level="2"
                            data-i18n="designer.animEnhanced">增强</button>
                        <button type="button" class="anim-level-btn" data-level="3"
                            data-i18n="designer.animEpic">华丽</button>
                    </div>
                </div>
            </section>

            <!-- 底部操作区：恢复默认 -->
            <section class="settings-section designer-bottom-actions" data-section-id="reset">
                <h2 data-i18n="designer.resetSection" class="designer-section-title">操作</h2>
                <button class="btn btn-secondary designer-reset-btn" id="resetBtn"
                    data-i18n="designer.reset">恢复默认</button>
            </section>

            <!-- 设置界面布局模式 -->
            <section class="settings-section" data-section-id="layout">
                <h2 data-i18n="designer.settingsLayout">设置界面布局</h2>
                <div class="setting-item">
                    <div class="anim-level-row">
                        <button type="button" class="anim-level-btn" data-layout-mode="scroll"
                            data-i18n="designer.layoutScroll">滚动</button>
                        <button type="button" class="anim-level-btn" data-layout-mode="columns"
                            data-i18n="designer.layoutColumns">多栏</button>
                        <button type="button" class="anim-level-btn" data-layout-mode="tabs"
                            data-i18n="designer.layoutTabs">选项卡</button>
                    </div>
                    <span class="toggle-desc" data-i18n="designer.settingsLayoutDesc">设置页面的布局方式（滚动 / 多栏 / 选项卡）</span>
                </div>
            </section>
        </div>

        <!-- 右侧：实时预览区（fixed，固定不随滚动移动） -->
        <aside class="designer-preview-aside">
            <h2 data-i18n="designer.preview">实时预览</h2>

            <!-- 预览卡片：圆角 / 阴影 / 字体晕影 -->
            <div class="designer-preview-card" id="previewCard">
                <div class="designer-preview-cover"></div>
                <div class="designer-preview-meta">
                    <div class="designer-preview-title" data-i18n="designer.previewTitle">示例曲目</div>
                    <div class="designer-preview-artist" data-i18n="designer.previewArtist">示例艺术家</div>
                </div>
            </div>

            <!-- 预览按钮：圆角 / 辉光 / 点击脉冲动画 -->
            <button class="designer-preview-btn" id="previewBtn" data-i18n="common.play">播放</button>

            <!-- 预览玻璃面板：毛玻璃模糊 / 阴影 / 圆角 -->
            <div class="designer-preview-panel" id="previewPanel">
                <span data-i18n="designer.preview">实时预览</span>
            </div>

            <!-- 动画预览区：持续运行的动画演示，直观反映动画速度与级别 -->
            <div class="designer-anim-demo">
                <div class="designer-anim-demo-label" data-i18n="designer.animation">动画</div>
                <div class="designer-anim-track">
                    <div class="designer-anim-ball" id="animBall"></div>
                </div>
                <div class="designer-anim-bars">
                    <i></i><i></i><i></i><i></i><i></i>
                </div>
                <button class="designer-anim-replay" id="animReplayBtn" title="重播" data-i18n-title="common.replay">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path
                            d="M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
                    </svg>
                </button>
            </div>
        </aside>
    </main>

    <div class="save-bar" id="saveBar" style="display: none;">
        <span data-i18n="settings.settingsChanged">设置已更改</span>
        <button class="btn btn-primary" id="saveBtn" data-i18n="designer.save">保存设计</button>
    </div>

    <!-- Mini Player Bar（让设计器页也能控制播放） -->
    <div id="mini-player" class="mini-player" style="display: none;">
        <div class="mini-player-left">
            <div id="mini-cover" class="mini-cover"></div>
            <div class="mini-info">
                <div id="mini-title" class="mini-title" data-i18n="common.unknown">未播放</div>
                <div id="mini-artist" class="mini-artist">--</div>
            </div>
        </div>
        <div class="mini-player-center">
            <button class="mini-btn mini-play-btn" id="mini-play" title="播放" data-i18n-title="common.play">
                <svg viewBox="0 0 24 24" width="24" height="24" id="mini-play-icon">
                    <path d="M8 5v14l11-7z" />
                </svg>
                <svg viewBox="0 0 24 24" width="24" height="24" id="mini-pause-icon" style="display:none;">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                </svg>
            </button>
        </div>
        <div class="mini-player-right">
            <button class="mini-btn" id="mini-expand" title="返回音乐库" data-i18n-title="player.backToLibrary">
                <svg viewBox="0 0 24 24" width="20" height="20">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                </svg>
            </button>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="modal-backdrop" id="confirmModal">
        <div class="modal modal-confirm">
            <div class="confirm-icon">
                <svg viewBox="0 0 24 24" width="28" height="28">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" />
                </svg>
            </div>
            <h3 id="confirmTitle">确认操作</h3>
            <p id="confirmMessage">确定要执行此操作吗？</p>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="confirmCancel">取消</button>
                <button class="btn btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>
</body>

</html>
