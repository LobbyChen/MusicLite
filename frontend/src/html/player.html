<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="/src/css/player.css" />
    <script src="/wails/ipc.js"></script>
        <script src="/wails/runtime.js"></script>
        <script src="/src/js/audio-manager.js" type="module"></script>
        <script src="/src/js/settings-apply.js" type="module"></script>
        <script src="/src/js/player.js" type="module"></script>
    <title>player module</title>
</head>

<body>

    <div class="titlebar">
        <div class="titlebar-left">
            <svg width="24" height="24" xmlns="http://www.w3.org/2000/svg" clip-rule="evenodd" xml:space="preserve" version="1.1">

            <g>
            <rect opacity="0" stroke-width="0" rx="4" id="svg_5" height="23.09522" width="23.09522" y="0.45239" x="0.45239" stroke="#000" fill="#ececf1"/>
            <g stroke-dasharray="5,2,2,2,2,2" fill="#666666" id="Icon">
            <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_1" d="m11.7619,2.25c-5.381,0 -9.75,4.369 -9.75,9.75c0,5.381 4.369,9.75 9.75,9.75c5.381,0 9.75,-4.369 9.75,-9.75c0,-5.381 -4.369,-9.75 -9.75,-9.75zm0,1.5c4.553,0 8.25,3.697 8.25,8.25c0,4.553 -3.697,8.25 -8.25,8.25c-4.553,0 -8.25,-3.697 -8.25,-8.25c0,-4.553 3.697,-8.25 8.25,-8.25z"/>
            <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_2" d="m10.4729,8.841l-2.649,1.681c-0.506,0.321 -0.812,0.879 -0.812,1.478c0,0.599 0.306,1.157 0.812,1.478c0.799,0.506 1.817,1.152 2.649,1.681c0.539,0.342 1.222,0.363 1.781,0.056c0.559,-0.308 0.907,-0.896 0.907,-1.534c0,-1.035 0,-2.327 0,-3.362c0,-0.638 -0.348,-1.226 -0.907,-1.534c-0.559,-0.307 -1.242,-0.286 -1.781,0.056zm0.804,1.267c0.077,-0.049 0.175,-0.052 0.254,-0.008c0.08,0.044 0.13,0.128 0.13,0.219c0,1.035 0,2.327 0,3.362c0,0.091 -0.05,0.175 -0.13,0.219c-0.079,0.044 -0.177,0.041 -0.254,-0.008c-0.832,-0.528 -1.851,-1.174 -2.649,-1.681c-0.072,-0.046 -0.116,-0.125 -0.116,-0.211c0,-0.086 0.044,-0.165 0.116,-0.211l2.649,-1.681z"/>
            <path fill="#00A4EF" stroke-dasharray="5,2,2,2,2,2" id="svg_3" d="m14.4109,8.75l0.006,0c0.964,0.003 1.744,0.786 1.744,1.75c0,0.871 0,2.129 0,3c0,0.964 -0.78,1.747 -1.744,1.75l-0.006,0l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0c0,0 0,0 0,0c0.138,0 0.25,-0.112 0.25,-0.25c0,-0.871 0,-2.129 0,-3c0,-0.138 -0.112,-0.25 -0.25,-0.25l0,0c-0.414,0 -0.749,-0.336 -0.749,-0.75c0,-0.414 0.335,-0.75 0.749,-0.75l0,0z"/>
            </g>
            </g>
            </svg>
            <span class="titlebar-title">MusicLite</span>
        </div>
        <div class="titlebar-controls">
            <button class="titlebar-btn" id="minimizeBtn" title="最小化">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 19h12v2H6z"/></svg>
            </button>
            <button class="titlebar-btn titlebar-close" id="closeBtn" title="关闭">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>
    </div>

    <div class="background-layer" id="bgLayer"></div>

    <div class="player-container">
        <div class="album-art-wrapper">
            <div class="album-art" id="coverImg"></div>
        </div>

        <div class="info-and-controls">
            <div class="track-info">
                <div class="track-name" id="trackName">加载中</div>
                <div class="artist-name" id="artistName">--</div>
            </div>

            <!-- 歌词区域 -->
            <div class="lyrics-area" id="lyricsArea">
                <div class="lyrics-collapsed" id="lyricsToggle">
                    <div class="lyrics-preview" id="lyricsPreview">暂无歌词</div>
                </div>

                <div class="lyrics-card" id="lyricsCard">
                    <div class="lyrics-wrapper" id="lyricsWrapper">
                        <div class="lyrics-content" id="lyricsContent">
                            <div class="no-lyrics">暂无歌词</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="progress-area">
                <span class="time-current" id="currentTime">0:00</span>
                <div class="slider-container">
                    <div class="track-bg"></div>
                    <div class="progress-fill" id="seekProgress"></div>
                    <input type="range" min="0" max="100" value="0" class="seek_slider" id="seekSlider" disabled>
                </div>
                <span class="time-duration" id="totalDuration">0:00</span>
            </div>

            <div class="controls-area">
                <div class="main-controls">
                    <button class="btn btn-play" id="playBtn">
                        <svg viewBox="0 0 24 24" id="playIcon">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <svg viewBox="0 0 24 24" id="pauseIcon">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
                        </svg>
                    </button>
                </div>

                <div class="volume-control">
                    <div class="volume-icon" id="volIcon">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                        </svg>
                    </div>
                    <div class="slider-container volume-slider-container">
                        <div class="track-bg"></div>
                        <div class="progress-fill" id="volProgress"></div>
                        <input type="range" min="0" max="100" value="70" class="volume_slider" id="volSlider">
                    </div>
                </div>

                <button class="btn btn-back" id="backBtn" title="返回上一页">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" preload="metadata"></audio>
</body>

</html>
