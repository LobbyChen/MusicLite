name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAILS_VERSION: v3.0.0
  NODE_VERSION: "22"

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe 需要完整 tag 历史
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compute version
        id: ver
        shell: bash
        run: |
          node scripts/version.mjs --ci
          source build/version-set.sh
          echo "::debug::Version=$VERSION SHA=$BUILD_SHA Count=$BUILD_NUM"

      - name: Sync version into build metadata
        shell: bash
        run: |
          set -euo pipefail
          # VERSION_BASE 为三段数字版本，用于只接受数字版本的字段（Windows 文件版本、macOS Bundle 版本）
          sed -i.bak "s/^  version: .*/  version: \"${VERSION_BASE}\"/" build/config.yml
          rm -f build/config.yml.bak
          sed -i.bak "s/^version: .*/version: \"${VERSION}\"/" build/linux/nfpm/nfpm.yaml
          rm -f build/linux/nfpm/nfpm.yaml.bak

          # Windows 可执行文件版本信息（embedded .syso）
          node -e "const fs=require('fs');const p='build/windows/info.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const v=(process.env.VERSION_BASE||'0.0.0').split('.').slice(0,3).join('.')+'.0';j.fixed.file_version=v;j.fixed.product_version=v;for(const k of Object.keys(j.info)){j.info[k].ProductVersion=process.env.VERSION_BASE;j.info[k].FileVersion=process.env.VERSION_BASE;}fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');"

          # 默认 NSIS 模板版本（CI 使用的 installer/installer.nsi 由 makensis 参数注入）
          sed -i.bak "s/!define INFO_PRODUCTVERSION \".*\"/!define INFO_PRODUCTVERSION \"${VERSION_BASE}\"/" build/windows/nsis/wails_tools.nsh
          rm -f build/windows/nsis/wails_tools.nsh.bak

          # macOS Bundle 版本（必须是数字点分版本）
          sed -i.bak "s#<string>0\.1\.0</string>#<string>${VERSION_BASE}</string>#g" build/darwin/Info.plist build/darwin/Info.dev.plist
          rm -f build/darwin/Info.plist.bak build/darwin/Info.dev.plist.bak

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: "[Linux] Install system dependencies"
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config rpm \
            libgtk-4-dev libwebkitgtk-6.0-dev libnotify-dev \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev \
            libasound2-dev libx11-dev libx11-xcb-dev libxtst-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: "[macOS] Install FFmpeg"
        if: matrix.platform == 'macos'
        run: brew install ffmpeg pkg-config

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: "[Windows] Prepare FFmpeg"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg

      - name: "[Windows] Ensure NSIS available"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis) -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          & $nsis /VERSION

      - name: "[Windows] Build"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ff = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          $env:CGO_ENABLED = "1"
          $env:CGO_CFLAGS = "-I$ff\include"
          $env:CGO_LDFLAGS = "-L$ff\lib -lavformat -lavcodec -lswresample -lavutil"
          # 测试二进制运行时需要 FFmpeg 的 DLL，加入 PATH 否则会以 0xc0000135 失败
          $env:PATH = "$ff\bin;$env:PATH"
          wails3 build
          go test ./internal/playback

      - name: "[Windows] Create portable package & installer"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ff = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force libs | Out-Null
          Copy-Item "$ff\bin\*.dll" libs\
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item bin\musiclite.exe dist\portable\
          Copy-Item libs\*.dll dist\portable\
          Compress-Archive -Path dist\portable\* -DestinationPath dist\MusicLite-Windows-x64-Portable.zip
          Remove-Item dist\portable -Recurse -Force
          New-Item -ItemType Directory -Force build\bin | Out-Null
          Push-Location installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 `
              /DPRODUCT_VERSION="$env:VERSION" `
              /DPRODUCT_FILENAME_TAG="B$env:VERSION" `
              installer.nsi
          Pop-Location
          Copy-Item (Get-ChildItem build\bin\*Setup*.exe | Select-Object -First 1).FullName dist\MusicLite-Windows-x64-Setup.exe

      - name: "[Linux] Build & test"
        if: matrix.platform == 'linux'
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-lavformat -lavcodec -lswresample -lavutil"
          wails3 build
          go test ./internal/playback

      - name: "[Linux] Create .deb & .rpm packages"
        if: matrix.platform == 'linux'
        env:
          GOARCH: amd64
          GIT_COMMITTER_NAME: LobbyChen
          GIT_COMMITTER_EMAIL: LobbyChen@lobbychen.top
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          mkdir -p dist
          cp bin/*.deb dist/ || true
          cp bin/*.rpm dist/ || true

      - name: "[macOS] Build & test"
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          PREFIX="$(brew --prefix)"
          export CGO_ENABLED=1
          export CGO_CFLAGS="-I$PREFIX/include"
          export CGO_LDFLAGS="-L$PREFIX/lib -lavformat -lavcodec -lswresample -lavutil"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          wails3 build
          go test ./internal/playback

      - name: "[macOS] Create .app bundle & zip"
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          wails3 task darwin:create:app:bundle
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent bin/musiclite.app dist/MusicLite-macOS-arm64.app.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicLite-${{ matrix.platform == 'windows' && 'Windows-x64' || matrix.platform == 'linux' && 'Linux-x64' || 'macOS-arm64' }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MusicLite-*
          path: collected
          merge-multiple: true

      - name: Assemble release assets
        run: |
          mkdir -p release-assets
          find collected -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
