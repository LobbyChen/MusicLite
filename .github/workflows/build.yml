name: Build & Release

on:
  # 只在 push v* 版本 tag 时自动触发（正式发布）
  push:
    tags:
      - 'v*'
  # 允许在 Actions 页面手动触发（用于测试构建，不会发布 release）
  workflow_dispatch:

permissions:
  contents: write

# 同一分支/标签的新构建启动时，自动取消仍在排队的旧构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 集中管理版本号，便于跨步骤/平台保持一致
  WAILS_VERSION: v3.0.0-beta.8
  NODE_VERSION: '22'

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe 需要完整 tag 历史
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ==================== 版本号计算（Node.js 跨平台脚本）====================
      # 输出 VERSION / BUILD_SHA / BUILD_NUM / VERSION_LDFLAGS 供后续步骤使用
      - name: Compute version
        id: ver
        shell: bash
        run: |
          node scripts/version.mjs --ci
          # Node 脚本已写入 $GITHUB_OUTPUT / $GITHUB_ENV，这里 source 以便本步骤日志可见
          source build/version-set.sh
          echo "::debug::Version=$VERSION SHA=$BUILD_SHA Count=$BUILD_NUM"

      - name: Sync version into build/config.yml
        shell: bash
        run: |
          set -euo pipefail
          # 写入 Wails 构建元信息（影响 Windows .syso 与 mac/linux 资源）
          sed -i.bak "s/^  productVersion: .*/  productVersion: \"${VERSION}\"/" build/config.yml
          sed -i.bak "s/^  fileVersion: .*/  fileVersion: \"${VERSION}\"/"   build/config.yml
          rm -f build/config.yml.bak
          # nfpm.yaml 供 Linux deb/rpm 包使用
          sed -i.bak "s/^version: .*/version: \"${VERSION}\"/" build/linux/nfpm/nfpm.yaml
          rm -f build/linux/nfpm/nfpm.yaml.bak
          # macOS Info.plist: CFBundleShortVersionString / CFBundleVersion
          # 文件可能不存在（非 macOS 平台交叉编译时按需创建），用 -f 守护避免 CI 失败
          if [ -f build/darwin/Info.plist ]; then
            sed -i.bak "s|<string>0\.[0-9]*\.[0-9]*</string>|<string>${VERSION}</string>|" build/darwin/Info.plist
            rm -f build/darwin/Info.plist.bak
          else
            echo "[skip] build/darwin/Info.plist not found, will be generated by wails3 task"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ==================== 平台特定依赖安装 ====================
      # Linux 系统依赖必须先于 Wails CLI 安装：Wails CLI 自身含 gtk4 cgo 代码
      - name: "[Linux] Install system dependencies"
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config rpm \
            libgtk-4-dev libwebkitgtk-6.0-dev libnotify-dev \
            libavformat-dev libavcodec-dev libswresample-dev libavutil-dev \
            libasound2-dev libx11-dev libx11-xcb-dev libxtst-dev \
            libxkbcommon-dev libxkbcommon-x11-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # ============================ Windows ============================
      # GitHub Windows runner 已预装 MinGW (gcc 14.2) 和 NSIS 3.10，仅在缺失时补装
      - name: "[Windows] Ensure NSIS available"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis) -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          & $nsis /VERSION

      # FFmpeg shared 构建不变，使用缓存
      - name: "[Windows] Cache native libs (FFmpeg)"
        if: matrix.platform == 'windows'
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: |
            libs
            ffmpeg
          key: ${{ runner.os }}-native-libs-ffmpeg-master-shared-v3

      - name: "[Windows] Prepare native libs (FFmpeg)"
        if: matrix.platform == 'windows' && steps.cache-libs.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force libs | Out-Null
          # FFmpeg shared 构建（含 .dll.a 导入库与头文件，用于 CGO 链接）
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg

      - name: "[Windows] Build"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ff = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          $env:CGO_ENABLED = "1"
          $env:CGO_CFLAGS = "-I$ff\include"
          $env:CGO_LDFLAGS = "-L$ff\lib -L$PWD\libs -lavformat -lavcodec -lswresample -lavutil"
          # VERSION_LDFLAGS 由 Compute version 步骤注入，Taskfile BUILD_FLAGS 模板读取
          wails3 build

      - name: "[Windows] Create installer & portable package"
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ff = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          # 汇总运行时 DLL 到 libs\
          Copy-Item "$ff\bin\*.dll" libs\
          # wails3 build 已输出 bin\musiclite.exe；NSIS 的 File 指令在 Windows
          # 大小写不敏感，可直接读取 ..\bin\MusicLite.exe，无需额外复制
          # NSIS 的 OutFile 指向 ..\build\bin\，需预先创建（NSIS 不会自动建目录）
          New-Item -ItemType Directory -Force build\bin | Out-Null
          # 构建 NSIS 安装程序：注入 PRODUCT_VERSION 与文件名版本片段
          Set-Location installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" /V2 `
              /DPRODUCT_VERSION="$env:VERSION" `
              /DPRODUCT_FILENAME_TAG="B$env:VERSION" `
              installer.nsi
          Set-Location ..
          # 整理发布产物：安装程序 + 绿色直开包
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item bin\musiclite.exe dist\portable\MusicLite.exe
          Copy-Item libs\*.dll dist\portable\
          Compress-Archive -Path dist\portable\* -DestinationPath dist\MusicLite-Windows-x64-Portable.zip
          Copy-Item (Get-ChildItem build\bin\*Setup*.exe | Select-Object -First 1).FullName dist\MusicLite-Windows-x64-Setup.exe
          Remove-Item dist\portable -Recurse -Force

      # ============================= Linux =============================
      # 版本号已由上方 "Sync version into build/config.yml" 步骤同步到 nfpm.yaml

      - name: "[Linux] Build"
        if: matrix.platform == 'linux'
        run: |
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-lavformat -lavcodec -lswresample -lavutil"
          # VERSION_LDFLAGS 由 Compute version 步骤注入，Taskfile BUILD_FLAGS 模板读取
          wails3 build

      - name: "[Linux] Create .deb & .rpm packages"
        if: matrix.platform == 'linux'
        env:
          GOARCH: amd64
          GIT_COMMITTER_NAME: LobbyChen
          GIT_COMMITTER_EMAIL: LobbyChen@lobbychen.top
        run: |
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          mkdir -p dist
          cp bin/*.deb bin/*.rpm dist/

      # ============================= macOS =============================
      - name: "[macOS] Install dependencies (ffmpeg)"
        if: matrix.platform == 'macos'
        run: brew install ffmpeg

      - name: "[macOS] Build .app bundle"
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          PREFIX="$(brew --prefix)"
          export CGO_ENABLED=1
          # 注意：不要 export GOOS，否则会污染 Taskfile 的 GOOS 调度变量
          export CGO_CFLAGS="-I$PREFIX/include -mmacosx-version-min=12.0"
          export CGO_LDFLAGS="-L$PREFIX/lib -lavformat -lavcodec -lswresample -lavutil -mmacosx-version-min=12.0"
          export MACOSX_DEPLOYMENT_TARGET=12.0
          # 前端资源 + bindings（production）
          wails3 task common:build:frontend
          # 编译主程序：$VERSION_LDFLAGS 已由 Compute version 步骤注入
          # 注入 -X MusicLite/app.Version / -X MusicLite/app.BuildSHA / -X MusicLite/app.BuildNum
          mkdir -p bin
          go build -tags production -trimpath -buildvcs=false -ldflags="-w -s ${VERSION_LDFLAGS}" -o bin/musiclite
          # 组装 .app bundle（与 create:app:bundle 一致）
          mkdir -p bin/MusicLite.app/Contents/MacOS bin/MusicLite.app/Contents/Resources
          cp build/darwin/icons.icns bin/MusicLite.app/Contents/Resources/
          if [ -f build/darwin/Assets.car ]; then
            cp build/darwin/Assets.car bin/MusicLite.app/Contents/Resources/
          fi
          cp bin/musiclite bin/MusicLite.app/Contents/MacOS/
          # Info.plist 已随仓库提交（git add -f 绕过 build/ gitignore），此处做防御
          if [ -f build/darwin/Info.plist ]; then
            cp build/darwin/Info.plist bin/MusicLite.app/Contents/
          else
            echo "[warn] build/darwin/Info.plist missing, .app bundle will lack it"
          fi

      - name: "[macOS] Bundle native dylibs into .app"
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          APP="bin/MusicLite.app"
          BIN="$APP/Contents/MacOS/musiclite"
          FW="$APP/Contents/Frameworks"
          mkdir -p "$FW"
          # 递归收集 Homebrew 动态库到 Contents/Frameworks 并改写 install name，
          # 使 .app 完全自包含，用户无需安装 brew ffmpeg
          while true; do
            added=0
            targets=("$BIN")
            for f in "$FW"/*.dylib; do
              [ -f "$f" ] && targets+=("$f")
            done
            for t in "${targets[@]}"; do
              libs="$(otool -L "$t" | tail -n +2 | awk '{print $1}')"
              for lib in $libs; do
                case "$lib" in
                  /opt/homebrew/*|/usr/local/opt/*|/usr/local/Cellar/*)
                    name="$(basename "$lib")"
                    install_name_tool -change "$lib" "@rpath/$name" "$t"
                    if [ ! -f "$FW/$name" ]; then
                      cp -L "$lib" "$FW/$name"
                      install_name_tool -id "@rpath/$name" "$FW/$name"
                      added=1
                    fi
                    ;;
                esac
              done
            done
            [ "$added" -eq 0 ] && break
          done
          install_name_tool -add_rpath "@executable_path/../Frameworks" "$BIN" || true
          codesign --force --deep --sign - "$APP"
          echo "--- 主程序依赖（应全部为 @rpath / 系统库）---"
          otool -L "$BIN"

      - name: "[macOS] Zip .app"
        if: matrix.platform == 'macos'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent bin/MusicLite.app dist/MusicLite-macOS-arm64.app.zip

      # ============================= 上传 =============================
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicLite-${{ matrix.platform == 'windows' && 'Windows-x64' || matrix.platform == 'linux' && 'Linux-x64' || 'macOS-arm64' }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: MusicLite-*
          path: collected
          merge-multiple: true

      - name: Assemble release assets
        run: |
          mkdir -p release-assets
          find collected -type f -exec cp {} release-assets/ \;
          cp scripts/macOS-Installer.sh release-assets/
          chmod +x release-assets/macOS-Installer.sh
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
